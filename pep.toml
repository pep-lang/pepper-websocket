[package]
name = "websocket"
version = "1.1.0"
description = "WebSocket (RFC 6455): client and server over TCP and TLS"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper-websocket"
# The oldest Pepper toolchain that builds the package (0.11 added
# `http.Response.upgrade`): CI also tests with it, and `pepper package`
# skips a version whose minimum is newer than the user's toolchain.
minimum_toolchain = "0.11.0"
